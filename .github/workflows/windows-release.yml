name: Windows build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AutoManualTester/AutoManualTester.csproj

      - name: Publish Windows x64
        run: dotnet publish AutoManualTester/AutoManualTester.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=1.0.${{ github.run_number }} -o artifacts/AutoManualTester-win-x64

      - name: Create update package and manifest
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/AutoManualTester-win-x64/* -DestinationPath artifacts/AutoManualTester-win-x64.zip
          $hash = (Get-FileHash artifacts/AutoManualTester-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            version = "1.0.${{ github.run_number }}"
            zipUrl = "https://github.com/devrupeshgadkhe/Repo_AutoManualTester/releases/latest/download/AutoManualTester-win-x64.zip"
            sha256 = $hash
          }
          $manifest | ConvertTo-Json | Set-Content -Path artifacts/version.json -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoManualTester-win-x64
          path: artifacts/AutoManualTester-win-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AutoManualTester v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/AutoManualTester-win-x64.zip
            artifacts/version.json
